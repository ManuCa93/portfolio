      <h1>University Projects</h1>
      <p>26 academic repositories from my Bachelor's, spanning healthcare and biomedical ML, wearable sensing, time series forecasting, Bayesian statistics, blockchain, robotics and reinforcement learning.</p>
      <p>26 repositories from coursework across the degree, covering a wide range of topics: healthcare and biomedical data (drug design, bioinformatics, brain tumor classification from MRI, stress detection from wrist-worn sensors, olive oil and food-compound quality), time series forecasting, Bayesian statistics and optimization, blockchain, robotics and drone control, reinforcement learning, anomaly detection with autoencoders, and sports/finance analytics (NBA shot data, credit risk). Written mostly as Jupyter notebooks and R Markdown, some solved individually and others in pairs or small groups depending on the course. Browse them all on GitHub.</p>
      
      <p>Tech stack: Python (Jupyter Notebook), R | NumPy, Pandas, scikit-learn, SciPy, statsmodels, Matplotlib, Seaborn, PyTorch, PyTorch Geometric, TensorFlow, XGBoost, LightGBM, SHAP, PyMC, ArviZ, RDKit, OpenCV, scikit-image, Stable-Baselines3, Robotics Toolbox, fairlearn | tidyverse, tidymodels, ggplot2</p>
      <p>A project by <a href="/">Manuel Cattoni</a>.</p>
