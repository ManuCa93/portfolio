      <h1>Enjoy the Night</h1>
      <p>A mobile and web app that tracks your drinks and calculates Blood Alcohol Content in real time, to help you stay safe on a night out.</p>
      <p>Enjoy the Night (Sober Track) estimates BAC decay over time from a user's profile and logged drinks, now with myth-busting explanations, persistent safety disclaimers and full multilingual support.</p>
      <ul><li>Real-time BAC Calculation: accurate blood alcohol estimates based on user profile and logged drinks.</li><li>Calculation Insights &amp; Myth-Busting (new): interactive popups explaining how the calculation works and debunking common drinking myths.</li><li>Health &amp; Safety Disclaimer (new): a persistent disclaimer across Dashboard, History and Settings promoting responsible drinking.</li><li>Multilingual Support (new): fully localized in English, German, Spanish, French and Italian.</li><li>Drink History &amp; Quick Add: a detailed log of past drinks plus a bottom-sheet shortcut to log a new one with minimal friction.</li></ul>
      <p>Tech stack: Flutter, Provider | iOS, Android, Web</p>
      <p>A project by <a href="/">Manuel Cattoni</a>.</p>
