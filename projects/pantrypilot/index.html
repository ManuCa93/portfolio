      <h1>PantryPilot</h1>
      <p>An AI-driven app for students and people living (and cooking) alone, merging diet tracking, grocery planning and pantry inventory into one minimalist Flutter experience.</p>
      <p>Built for anyone organizing their own food solo, like students or young professionals living alone, PantryPilot uses Google Gemini 2.5 Flash in the backend to read diets straight from a photo or PDF, then turns that plan into a priced grocery list, a live pantry inventory and zero-waste recipes, all inside one glassmorphic, dual-tab analytics dashboard. Before publishing it, I plan to test it myself during the two months I'll be living alone in Berlin, while I also figure out a monetization strategy.</p>
      <ul><li>Multimodal Diet Scanner: imports diets straight from a photo or PDF via Gemini 2.5 Flash, handling OCR, translation and portion sizing.</li><li>Smart Price Estimation: estimates the precise cost of any grocery list across multiple countries (IT, DE, CH).</li><li>Zero-Waste Recipe Generator (&quot;Svuota Frigo&quot;): turns expiring pantry items into recipes that minimize food waste.</li><li>Unified Analytics Dashboard: a dual-tab view tracking both macronutrients and grocery spending.</li><li>Magic Pantry (new): automatically deducts recipe ingredients from inventory and merges duplicate foods, now with diet reuse via a calendar and a smart allergens backend.</li><li>Premium minimalist UI: glassmorphic navigation, immersive cooking mode, zero emojis.</li></ul>
      <p>Tech stack: Flutter, Riverpod, Hive, Google Gemini 2.5 Flash, Node.js</p>
      <p>A project by <a href="/">Manuel Cattoni</a>.</p>
