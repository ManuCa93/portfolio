      <h1>MotoGP Position Estimator</h1>
      <p>A virtual pit wall for MotoGP: live lap-time and position calls, race pace and tyre strategy, read off roughly 73,000 real laps.</p>
      <p>A machine learning suite acting as a &quot;Virtual Pit Wall&quot;: it predicts live lap times, grid positions, race pace and tyre strategy for MotoGP, built on a SQLite pipeline ingesting real PDF timing sheets (2024-2026 seasons, 34 riders, 23 circuits, ~73k laps).</p>
      <ul><li>Live Lap Time &amp; Position Predictor: estimates a rider's final lap time and live leaderboard position at each sector, using an ensemble of 5 regressors (XGBoost, SVR, Neural Network, Ridge, AdaBoost).</li><li>Race Pace &amp; Tyre Strategy Engine: predicts average race pace, tyre degradation and likely compound choice from Free Practice telemetry and weather conditions.</li><li>Race Weekend Analysis (new): per-session report card, an &quot;ideal lap&quot; execution score, and lap-by-lap position/pace charts.</li><li>Analytics Dashboard: algorithmic rider ratings, momentum indicator, circuit breakdown, head-to-head comparison, team performance trends.</li><li>Advanced EDA: 3D environmental mapping, Random Forest feature importance, K-Means/PCA circuit clustering.</li></ul>
      <p>Tech stack: Python, Flask, scikit-learn, XGBoost, Pandas, SQLite | Render</p>
      <p>A project by <a href="/">Manuel Cattoni</a>.</p>
