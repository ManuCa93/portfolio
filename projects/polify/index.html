      <h1>Polify</h1>
      <p>A political matching test that explains every question before you answer, scoring your affinity with Italian and international parties across 68 real, documented issues.</p>
      <p>Polify walks you through 68 documented political issues, weighting each answer against 239+ verified party positions to compute your affinity, nationally and, for the first time, across 10 other countries. Built in the run-up to the 2027 Italian general election, it's transparent about its own gaps: newer or smaller parties (e.g. ORA!, Potere al Popolo) still have positions documented on fewer than half of the 68 issues, and that coverage is shown on every party's page instead of being hidden behind an average.</p>
      <ul><li>Transparent, documented scoring engine: matches answers against 239+ verified, locked party positions, weighted by source reliability (e.g. parliamentary vote vs. statement).</li><li>International Match (new): discover your closest ideologies and matching parties across 10 different countries.</li><li>Area-by-area analysis: separate rankings across 9 topic areas (economy, rights, etc.), because no one agrees with a single party on everything.</li><li>Separated-newsroom architecture: a local text editor (on a dedicated port) lets editors write and score questions in real time, watching the impact on the model, with no code.</li><li>Privacy-first results &amp; sharing: encrypted comparison via URL (&quot;Challenge&quot;); the server stores nothing, every calculation happens in the browser, GDPR-friendly.</li><li>Premium aesthetics &amp; UX: modern black-and-white interface with native dark mode, smooth micro-animations, single-column layout, and a built-in glossary for complex terms.</li></ul>
      <p>Tech stack: Next.js 16, React 19, Tailwind CSS v4, shadcn/ui, GSAP</p>
      <p>A project by <a href="/">Manuel Cattoni</a>.</p>
    </noscript>
