      <h1>Pomodoro Timer</h1>
      <p>A highly customizable Pomodoro timer and study analytics dashboard, available as a web app and an Electron desktop app.</p>
      <p>Goes beyond simple countdowns: a mini-timer widget, a Notion-style task board and a full analytics dashboard turn the classic Pomodoro flow into a lightweight study companion, on the web or as a desktop app.</p>
      <ul><li>Mini-Timer Widget (new): a floating, always-on-top window (desktop) or popup (web) that keeps you aware of time while working in other apps.</li><li>Notion-Style Task Board (new): set a macro-subject, outline topics and manage tasks in an interactive, keyboard-navigable table, saved automatically.</li><li>Info &amp; Settings Panel (new): adjust durations, fully customize the color theme, and toggle aesthetic background bubbles.</li><li>Analytics Dashboard: track daily, weekly, monthly and lifetime progress with interactive Chart.js charts.</li><li>Core Timer: classic work → short break → long break flow with a responsive circular progress indicator.</li></ul>
      <p>Tech stack: Vanilla JS, Electron, Chart.js, LocalStorage | GitHub Pages</p>
      <p>A project by <a href="/">Manuel Cattoni</a>.</p>
