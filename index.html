<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <!-- The MC monogram is the site's mark: the browser tab, bookmarks, the home
         screen and the favicon Google shows beside the result. Google wants a
         square in multiples of 48px, hence the 192 PNG next to the SVG. -->
    <link rel="icon" href="/favicon.ico" sizes="48x48" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="icon" type="image/png" sizes="192x192" href="/icon-192.png" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <!-- Light and dark follow the device; the bar colours match --bg in each. -->
    <meta name="theme-color" content="#ffffff" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#0d0d0d" media="(prefers-color-scheme: dark)" />
    <meta
      name="description"
      content="%SITE_DESCRIPTION%"
    />
    <meta name="color-scheme" content="light dark" />
    <meta name="author" content="%NAME%" />
    <meta name="robots" content="index, follow, max-image-preview:large" />
    <link rel="canonical" href="%SITE_URL%/" />
    <title>%SITE_TITLE%</title>

    <!-- Link previews. The homepage uses the portrait (self-hosted, so Google
         can crawl it); each project page gets its own card instead, swapped in
         at build time by vite.config.js. -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="%NAME%" />
    <meta property="og:locale" content="en_US" />
    <meta property="og:locale:alternate" content="it_IT" />
    <meta property="og:locale:alternate" content="de_DE" />
    <meta property="og:title" content="%SITE_TITLE%" />
    <meta
      property="og:description"
      content="%SITE_DESCRIPTION%"
    />
    <meta property="og:image" content="%AVATAR_URL%" />
    <meta property="og:image:width" content="460" />
    <meta property="og:image:height" content="460" />
    <meta property="og:image:alt" content="%NAME%" />
    <meta property="og:url" content="%SITE_URL%/" />
    <meta name="twitter:card" content="summary" />
    <meta name="twitter:title" content="%SITE_TITLE%" />
    <meta name="twitter:image" content="%AVATAR_URL%" />

    <!-- Tells search engines that this page IS a person, so a search for the
         name can surface the site rather than just the repositories. -->
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@graph": [
          {
            "@type": "WebSite",
            "@id": "%SITE_URL%/#website",
            "url": "%SITE_URL%/",
            "name": "%NAME%",
            "inLanguage": [
              "en",
              "it",
              "de"
            ],
            "author": {
              "@id": "%SITE_URL%/#person"
            }
          },
          {
            "@type": "Person",
            "@id": "%SITE_URL%/#person",
            "name": "%NAME%",
            "url": "%SITE_URL%/",
            "image": "%AVATAR_URL%",
            "jobTitle": "Software Developer",
            "description": "Student and software developer from Varese. Data & AI, mobile apps, websites and games.",
            "address": {
              "@type": "PostalAddress",
              "addressLocality": "Varese",
              "addressCountry": "IT"
            },
            "sameAs": [
              "%GITHUB_URL%",
              "%LINKEDIN_URL%",
              "%INSTAGRAM_URL%",
              "%HEVY_URL%",
              "%STRAVA_URL%"
            ]
          }
        ]
      }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <noscript>
      <h1>%NAME%</h1>
      <p>
        Student and software developer from Varese, Italy. Data &amp; AI, mobile
        apps, websites and games. Find me on
        <a href="%GITHUB_URL%">GitHub</a> and
        <a href="%LINKEDIN_URL%">LinkedIn</a>.
      </p>
    </noscript>
    <!-- Cookieless analytics (no consent banner needed); dashboard at
         %GOATCOUNTER_CODE%.goatcounter.com. Click events are sent from App.jsx. -->
    <script
      data-goatcounter="https://%GOATCOUNTER_CODE%.goatcounter.com/count"
      async
      src="https://gc.zgo.at/count.js"
    ></script>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
